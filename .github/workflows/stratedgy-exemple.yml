name: Include-specific-property
on:
  workflow_dispatch:
  push:
    branches: [feature/tp-ci]
    paths: [.github/workflows/stratedgy-exemple.yml]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ["20.x", "21.x"]
        include:
          - os: ubuntu-latest
            node-version: "20.x"
            tag: experimental
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Fail if experimental
        if: matrix.tag == 'experimental'
        run: exit 1
      - name: Run tests
        run: echo "Running tests on ${{ matrix.os }} / Node ${{ matrix.node-version }} / tag=${{ matrix.tag }}"
